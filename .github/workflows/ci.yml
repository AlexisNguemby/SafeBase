name: SafeBase CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Un nouveau push sur la même branche annule le run précédent devenu obsolète
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-server-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      # npm ci : installation exacte depuis le lockfile, plus rapide que npm install
      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Run server tests
        run: |
          cd server
          npm test

  check-worker-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pas de go.sum (aucune dépendance) : rien à mettre en cache
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Vet Worker Go
        run: |
          cd worker-go
          go vet ./...

      # go test compile déjà le paquet : pas besoin d'un go build séparé
      - name: Run Worker Go tests
        run: |
          cd worker-go
          go test ./...

  check-client-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies & Build React
        run: |
          cd client
          npm ci
          npm run build --if-present

  # CD : construit les 3 images Docker une fois tous les tests passés.
  # Sur une PR : construction seule (vérifie que les Dockerfiles fonctionnent).
  # Sur main : construction + publication sur GitHub Container Registry (ghcr.io).
  docker-images:
    needs: [ check-server-node, check-worker-go, check-client-web ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ server, worker-go, client ]
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags : "latest" + le SHA du commit (permet de revenir à une version précise)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
